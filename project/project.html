<html>

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />

    <!-- My CSS -->

    <link rel="stylesheet" href="style.css" />

    <!-- Font Awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Google Fonts -->

    <link href="https://fonts.googleapis.com/css2?family=Barlow+TT:ital,wght@0,400;0,700;0,800;0,900;1,400&display=swap"
        rel="stylesheet" />

    <title>Portfolio</title>
</head>

<body>
    <div id="social-media" class="container-fluid">
        <div class="container text-white py-5">
            <h4 class="text-info">social media</h4>
            <h1 class="text-info m-heading">follow me on social media</h1>
            <div class="row pt-3">
                <div class="col-3 media_link bg-secondary btn" href="#">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-dark">github</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fab fa-github fa-2x text-dark"></i>
                        </div>
                    </div>
                </div>
                <div class="col-3 media_link bg-danger btn" href="#">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-dark">youtube</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fab fa-youtube fa-2x text-dark"></i>
                        </div>
                    </div>
                </div>
                <div class="col-3 media_link bg-success btn" href="#">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-dark">email</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fas fa-envelope fa-2x text-dark"></i>
                        </div>
                    </div>
                </div> 
            </div>
        </div>
    </div>
</body>

</html>
