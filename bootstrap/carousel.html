<!DOCTYPE html>
<html lang="en">
<head>
  <title>Carousel</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
   <style>
    .carousel-inner img{
        width:500px;
        height:300px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>disney movies</h2>  
  <div id="myCarousel" class="carousel slide" data-ride="carousel">
    <!-- Indicators -->
    <ol class="carousel-indicators">
      <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
      <li data-target="#myCarousel" data-slide-to="1"></li>
      <li data-target="#myCarousel" data-slide-to="2"></li>
      <li data-target="#myCarousel" data-slide-to="3"></li>
      <li data-target="#myCarousel" data-slide-to="4"></li>
    </ol>

    <!-- Wrapper for slides -->
    <div class="carousel-inner">
      <div class="item active">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPbyf1GApsp4fq9l8_PfqyghBEUUEilYooVQ&s" alt="encanto">
      </div>

      <div class="item">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTzUupnJ1b5g193-zNDe2mnOlt3AhF6wP09Dg&s" alt="toy story">
      </div>
    
      <div class="item">
        <img src="https://thedisinsider.com/wp-content/uploads/2020/12/little-mermaid-plus.jpeg" alt="the little mermaid">
      </div>

      <div class="item">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTaoC6WMqq7MZccumRVZe_xKeNVb0JYDi4GWw&s" alt="zootopia">
      </div>

      <div class="item">
        <img src="https://www.rollingstone.com/wp-content/uploads/2023/11/Walt-Disney-movies-ranked-illo.jpg" alt="disney movies">
      </div>
    </div>

    <!-- Left and right controls -->
    <a class="left carousel-control" href="#myCarousel" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="right carousel-control" href="#myCarousel" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>
</div>
</body>
</html>
