<html>
    <head>
        <title>progress bar</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        <style>
            .progress{
                background-color: deeppink;
            }
            .progress-bar{
                background-color: darkorchid;
                color:black
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>progress bar</h2>
            <p>to create a default progress bar, add a .progress class to a container element and add
            the progress bar class to it's child element.
            use the CSS width property to set teh width of the progress bar</p>
        </div>
        <div class="progress">
            <div class="progress-bar" style="width:70%">70%</div>
        </div>
    </body>
</html>
