<html>
    <head>
        <title>slider</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
         <style>
            .progress{
                background-color:aquamarine;
            }
            .progress-bar{
                background-color:darkcyan;
                color:black
            }
            .container{
                background-color: lightgreen;
            }
        </style>
    </head>
    <body>
        <h2>a slider</h2>
        <div class="container">
            <h4>precious memories</h4>
            <span class="badge">that one picnic</span>
            <span class="badge">last day of school</span>
            <span class="badge">summer vacations</span>
        </div><br>
        <h4>a way to my memories</h4>
        <div>
            <button class="btn btn-primary">visit to the seaside</button>
            <button class="btn btn-success">world tour with my family</button>
            <button class="btn btn-warning">that one wedding</button>
            <button class="btn btn-danger">my farmhouse birthday party</button>
            <button class="btn btn-secondary">EID</button>
        </div><br>
        <h4>the progress I have made after these wholesome memories</h4>
         <div class="progress">
            <div class="progress-bar" style="width:70%">70%</div>
        </div><br>
    </body>
</html>
