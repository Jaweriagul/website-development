<html>
    <head>
        <title>color and border</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container border border-dark p-5 my-3">
            <h1>color and border</h1>
            <p>this is a paragraph inside a bordered container</p>
        </div>
        <div class="container bg-success p-5 mb-5 text-danger">
            <h1>background color</h1>
            <p>this is a container with background color</p>
        </div>
        <div class="container bg-warning p-3 my-3 text-dark">
            <h1>another background color</h1>
            <p>this is another container with a different background color</p>
        </div>
    </body>
</html>
