<html>
    <head>
        <title>typography</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </head>
    <body>
        <h1>abbreviations</h1>
        <p><abbr title="World Health Organization">WHO</abbr></p>
        <blockquote class="blockquote">
            <h1>blockquote</h1>
            <p>my favourite drink is mint lemonade</p>
            <footer class="blockquote-footer">anonymous</footer>
        </blockquote>
        <h1>multiple code lines</h1>
        <p>for multiple code lines use pre tag:</p>
        <pre>
            I wish I could 
            travel to the moon 
            and see the stars
        </pre>
        <h1>keyboard input</h1>
        <p>to save a file press <kbd>Ctrl+S</kbd></p>
    </body>
</html>
