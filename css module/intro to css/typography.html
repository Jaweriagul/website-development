<html>
    <head>
        <title>typography</title>
        <style>
            .text1{
                color:cadetblue;
                font-size: 24px;
                font-family: 'Times New Roman', Times, serif;
            }
            .p1{
                color:coral;
                font-family: 'Courier New', Courier, monospace;
            }
        </style>
    </head>
    <body>
        <h1>typography</h1>
        <p class="text1">I love biryani</p>
        <p class="p1"><b>this is a paragraph where I have used different font stylings</b></p>
    </body>
</html>
