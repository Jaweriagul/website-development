<html>
    <head>
        <title>text styling</title>
        <style>
            h1{
                font-family: sans-serif;
                color:darkblue;
                font-size:36px;
                text-decoration: underline overline;
                text-transform: uppercase;
            }
            #lens{
                font-family:Georgia, 'Times New Roman', Times, serif;
                color:black;
                font-size: 16px;
                text-shadow: 2px 2px 4px deepskyblue;
            }
            div{
                width:200px;
                height:100px;
                border: 2px solid black;
            }
            #mydiv{
                transform: rotateX(180deg);
                box-shadow: 10px 10px 5px pink;
            }
            #tree{
                font-size: 48px;
            }
            #indent{
                text-indent: 50px;
            }
            #box{
                box-shadow: 10px 10px 5px pink;
            }
        </style>
    </head>
    <body>
        <h1>convex lens</h1>
        <p id="lens">A convex lens is a lens that is thicker at the middle and creates real and inverted images</p>
        <div id="box">
           <div id="tree">🌳</div>
        </div><br><br>
        <div id="mydiv">
           <div id="tree">🌳</div>
        </div>
        <p id="indent">this is an example of how a convex lens works</p>
    </body>
</html>
