<html>
    <head>
        <style>
            /*the animation code*/
            @keyframes naruto{
                0%{background-color: blueviolet ;}
                15%{background-color: steelblue;}
                30%{background-color: teal;}
                45%{background-color: yellowgreen;}
                60%{background-color: lightcoral;}
                75%{background-color: lightpink;}
                90%{background-color: deeppink;}
                100%{background-color: brown;}
            }
            /*the element to apply the animation to*/
            div{
                width: 100px;
                height: 100px;
                background-color: darkblue;
                animation-name: naruto;
                animation-duration: 10s;
            }
        </style>
    </head>
    <body>
        <div>stars</div>
    </body>
</html>
