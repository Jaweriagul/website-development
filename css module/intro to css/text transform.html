<html>
    <head>
        <style>
            div{
                width:300px;
                height:100px;
                background-color: lightseagreen;
                border: 1px solid black;
            }
            #mydiv{
                transform: rotateX(180deg);
            }
        </style>
    </head>
    <body>
        <h1>text transformation</h1>
        <p>I love watching movies</p>
        <div>turkey</div>
        <div id="mydiv">turkey</div>
    </body>
</html>
