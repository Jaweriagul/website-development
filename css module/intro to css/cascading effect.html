<html>
    <head>
        <title>cascading effect</title>
        <style>
            body{
                background-color: lightgoldenrodyellow;
                background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR80FxYEB5nMRRw-XZwXGPJZr6FfuvwMicMNw&s');
                background-repeat: no-repeat;
                background-position: top center;
                background-attachment: fixed;
            }
            h1{
                color:darkgreen;
                text-align:center;
            }
            p{
                color:darkred;
                text-align:center
            }
        </style>
    </head>
    <body>
        <br><br><br><br><br><br><br><br><br><br><br><br>
        <h1>cascading effect</h1>
        <p>this is an example of the cascading effect in CSS</p>
    </body>
</html>
