<html>
    <head>
        <title>positioning</title>
        <style>
            div{
                right:30px;
                border: 3px solid plum;
            }
            div.absolute{
                position: absolute;
                left:50px;
                border:3px solid skyblue;
            }
            div.relative{
                position: relative;
                left: 100px;
                border: 3px solid lightcoral;
            }
            div.fixed{
                position: fixed;
                top: 0;
                right: 20px;
                width: 300px;
                border: 3px solid lightseagreen;
            }
            div.sticky{
                position: sticky;
                top:1px;
                right:20px;
                width:100px;
                border: 3px solid lemonchiffon
            }
        </style>
    </head>
    <body>
        <!--change the position to show the difference
        static
        relative
        absolute
        fixed
        sticky-->
        <h2>positioning</h2>
        <div>iv with no positioninng</div>
        <div class="sticky">
            div with sticky positioning property
        </div>
        <div class="relative">
            div with relative positioning property
        </div>
        <div class="absolute">
            div with absolute positioning property
        </div>
        <div class="fixed">
            div with fixed positioning property
        </div>
