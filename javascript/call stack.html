<html>
    <head>
        <title>call stack</title>
    </head>
    <body>
        <h2>call stack</h2>
        <p>Do a calculation and then display the result</p>
        <p id="demo"></p>
        <script>
            function add(a,b,c){
                return a+b+c;
            }
            function avg(a,b,c){
                return add(a,b,c)/3;
            }
            let result = avg(25,10,15);
            document.getElementById("demo").innerHTML=result;
        </script>
    </body>
</html>
