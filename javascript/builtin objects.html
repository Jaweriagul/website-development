<html>
    <head>
        <title>builtin objects</title>
    </head>
    <body>
        <h2>builtin objects in JavaScript</h2>
        <script>
            var value=Math.abs(20);
            document.write("test value: " + value+"<br>");
           
            var value= Math.acos(1);
            document.write("cos1: " + value+"<br>");
            
            var value= Math.asin(1);
            document.write("sin1: " + value+"<br>");
           
            var value= Math.atan(90);
            document.write("tan90: " + value+"<br>");
        </script>
    </body>
</html>
