<html>
    <head>
        <title>static class in js</title>
    </head>
    <body>
        <h2>static class in js</h2>
        <p id="hello"></p>
        <p id="hi"></p>
        <p id="welcome"></p>
        <script>
            class student {
                constructor(name) {
                    this.name = name;
                }
                //static method
                static hello() {
                    return "hello";
                }
                static welcome(x) {
                    return "welcome " + x.name;
                }
                hi() {
                    return "hi " + this.name;
                }
            }
            myname = new student("John");
            document.getElementById("hello").innerHTML = student.hello();
            document.getElementById("hi").innerHTML = myname.hi();
            document.getElementById("welcome").innerHTML = student.welcome(myname);
        </script>
    </body>
</html>
