<html>
    <head>
        <title>array evaluation</title>
    </head>
    <body>
        <h2>array evaluation</h2>
        <p>click the button to evaluate the JS code</p>
        <button onclick="myfunction()">click</button>
        <p id="balloon"></p>
        <script>
           function myfunction(){
            var x = 10;
            var y = 8;
            var z = 25;

            var a = eval("x+y") + "<br>";
            var b = eval("54+13") + "<br>";
            var c = eval("x+y+z") + "<br>";

            var res = a+b+c;
            document.getElementById("balloon").innerHTML= res;
           }
        </script>
    </body>
</html>
