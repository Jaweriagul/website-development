<html>
    <head>
        <title>arguments</title>
    </head>
    <body>
        <h2>arguments in js</h2>
        <p id="result"></p>
        <script>
            function findmax(){
                var max=0;
                var i;
                for(i=0; i<arguments.length; i++){
                    if(arguments[i]>max){
                        max=arguments[i];
                    }
                }
                return max;
            }
            document.getElementById("result").innerHTML=findmax(1,3,5,7,9);
        </script>
    </body>
</html>
