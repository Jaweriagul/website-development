<html>
    <head>
        <title>error handling</title>
    </head>
    <body>
        <h1>error handling</h1>
        <p><b>this example demonstrates error handling:</b></p>
        <p id="demo"></p>
        <script>
            try {
                addalert("this page contains an error");
            }
            catch(err){
                document.getElementById("demo").innerHTML = err.message;
            }
        </script>
    </body>
</html>
