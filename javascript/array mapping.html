<html>
    <head>
        <title>array mapping</title>
    </head>
    <body>
        <h2>
            array mapping
        </h2>
        <p id="demo"></p>
        <script>
            var numbers=[12,16,14,13,15];
            function myfunction(num){
                return num*2;
            }
            var newarray = numbers.map(myfunction);
            document.getElementById("demo").innerHTML= newarray;
        </script>
    </body>
</html>
