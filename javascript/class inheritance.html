<html>
    <head>
        <title>class inheritance in js</title>
    </head>
    <body>
        <h2>class inheritance in js</h2>
        <p id="cars"></p>
        <script>
            //creating a parent class
            class car {
                constructor(brand) {
                    this.carname = brand;
                }
                present() {
                    return "I have a " + this.carname;
                }
            }
            //creating a child class
            class model extends car {
                constructor(brand, mod){
                    super(brand);
                    this.model = mod;
                }
                show() {
                    return this.present() + ", it is a " + this.model;
                }
            }
            let mycar = new model ("toyota", "supra");
            document.getElementById("cars").innerHTML = mycar.show();
        </script>
    </body>    
</html>
