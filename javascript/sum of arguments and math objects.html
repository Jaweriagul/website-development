<html>
    <head>
        <title>sum of arguments and math objects</title>
    </head>
    <body>
        <h2>sum of arguments and maths objects</h2>
        <p id="demo"></p>
        <script>
            function sum() {
                var sum = 0;
                for (i = 0; i < arguments.length; i++) {
                    sum += arguments[i];
                }
                return sum;
            }

            document.getElementById("demo").innerHTML = sum(1, 2, 3, 4, 5);

            var value = Math.sin(45);
            document.write("the value of sin 45 is " + value + "<br>");
            var value = Math.cos(45);
            document.write("the value of cos 45 is " + value + "<br>");
            var value = Math.tan(45);
            document.write("the value of tan 45 is " + value);
        </script>
    </body>
</html>
