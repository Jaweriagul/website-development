<html>
    <head>
        <title>Converting Strings</title>
    </head>
    <body>
        <h2>Converting, Replacing, and Searching Strings</h2>
        <p id="demo1"></p>
        <p id="demo"></p>
        <script>
            var x=45;
            var y=27;
            document.getElementById("demo1").innerHTML = x + y ;
            document.getElementById("demo").innerHTML = String(x) + String(y);
        </script>
    </body>
</html>
