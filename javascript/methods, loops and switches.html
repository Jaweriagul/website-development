<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript String methods and Loops</title>
    </head>
  <body>
    <h2>JavaScript String Methods and Loops</h2>
    <p>Numbers form 1 to 10</p>
    <p id="result"></p>
    <script>
    var number = " "
    for (i = 1; i < number.length; i++) {
        number += number[i] + " <br> ";
    }
    document.write("The random value is " + Math.floor(Math.random() * 100) + "<br>" + "<br>");
    
    var day = 3;
    switch(new Date().getDay()) {
        case 0:
            day = "Sunday";
            break;
        case 1:
            day = "Monday";
            break;
        case 2:
            day = "Tuesday";
            break;
        case 3:
            day = "Wednesday";
            break;
        case 4:
            day = "Thursday";
            break;
        case 5:
            day = "Friday";
            break;
        case 6:
            day = "Saturday";
    }
    document.write("Today's day is " + day);
    </script>
  </body>
</html>
