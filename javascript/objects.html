<html>
    <head>
        <title>objects in js</title>
    </head>
    <body>
        <h2>objects</h2>
        <p id="demo"></p>
        <script>
            //create an object
            var person={
                name:"I ",
                age:"16",
                grade:"11th",
            };
            //display some data from the object
            document.getElementById("demo").innerHTML=person.name + "am " + person.age + " years old and i am in " + person.grade + " grade";
        </script>
    </body>
</html>
