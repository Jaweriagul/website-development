<html>
    <head>
        <title>JavaScript Statements</title>
    </head>
    <body>
        <h1>javascript statements</h1>
        <p>A <b>JavaScript program</b> is a list of <b>statements</b> to be executed by the computer</p>
        <p id="demo"></p>
        <script>
            var x,y,z;//statement 1
            var x=16;//statement 2
            var y=2;//statement 3
            var z=x/y;//statement 4
            document.getElementById("demo").innerHTML="the result is: " + z;//statement 5
        </script>
    </body>
</html>
