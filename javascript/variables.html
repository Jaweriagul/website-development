<html>
    <head>
        <title>Variables in JavaScript</title>
    </head>
    <body>
        <h1>JavaScript Variables</h1>
        <p>product of two numbers</p>
        <p id="result"></p>
        <script>
            var num1=2;
            var num2=6;
            var product=num1*num2;
            document.getElementById("result").innerHTML="The product is: " + product;
        </script>
    </body>
</html>
